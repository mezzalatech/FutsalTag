name: Build & Release ARF FutsalTag (macOS + Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon-M1-M4
            os: macos-14
            target: aarch64-apple-darwin
            tauri_platform: darwin-aarch64
          - arch: Intel-Mac
            os: macos-15-intel
            target: x86_64-apple-darwin
            tauri_platform: darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FFmpeg & Whisper CLI via Homebrew
        run: |
          brew install ffmpeg whisper-cpp

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Stage macOS offline binaries
        run: bash scripts/prepare-offline-bundle-macos.sh

      - name: Run Svelte check & Rust unit tests
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build ARF FutsalTag macOS DMG & Updater Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run tauri build --target ${{ matrix.target }} --bundles app,dmg
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret not set; skipping updater artifacts."
            bun run tauri build --target ${{ matrix.target }} --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Stage Release & Updater Assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/
          TARBALL="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n1 || true)"
          if [ -n "$TARBALL" ] && [ -f "${TARBALL}.sig" ]; then
            OUT_TAR="ARF-FutsalTag-${{ matrix.arch }}.app.tar.gz"
            cp "$TARBALL" "release-assets/${OUT_TAR}"
            cp "${TARBALL}.sig" "release-assets/${OUT_TAR}.sig"
            OUT_TAR="$OUT_TAR" TAURI_PLATFORM="${{ matrix.tauri_platform }}" python3 - <<'PY'
          import json, os, pathlib
          out_tar = os.environ["OUT_TAR"]
          plat = os.environ["TAURI_PLATFORM"]
          sig = pathlib.Path(f"release-assets/{out_tar}.sig").read_text().strip()
          meta = {
              "platform": plat,
              "filename": out_tar,
              "signature": sig,
          }
          pathlib.Path(f"release-assets/platform-{plat}.json").write_text(json.dumps(meta))
          PY
          fi

      - name: Upload macOS DMG & Updater Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARF-FutsalTag-macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer (EXE & MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install FFmpeg & FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $realBin = (Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Sort-Object Length -Descending | Select-Object -First 1).DirectoryName
          if (-not $realBin) { throw "Real ffmpeg.exe binary not found under Chocolatey lib." }
          New-Item -ItemType Directory -Force -Path "src-tauri\resources\bin" | Out-Null
          Copy-Item "$realBin\ffmpeg.exe" "src-tauri\resources\bin\ffmpeg.exe" -Force
          Copy-Item "$realBin\ffprobe.exe" "src-tauri\resources\bin\ffprobe.exe" -Force

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify Windows offline binaries & models
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-offline-bundle.ps1

      - name: Run Svelte check & Rust unit tests
        shell: pwsh
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build ARF FutsalTag Windows Installer & Updater Bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            bun run tauri build
          } else {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY secret not set; skipping updater artifacts."
            $nosign = Join-Path $env:RUNNER_TEMP "tauri-nosign.json"
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $nosign -Encoding UTF8
            bun run tauri build --config $nosign
          }

      - name: Stage Windows Release & Updater Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" "release-assets\" -Force
          Copy-Item "src-tauri\target\release\bundle\msi\*.msi" "release-assets\" -Force
          $nsisExe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsisZip = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          $updaterArtifact = if ($nsisExe -and (Test-Path "$($nsisExe.FullName).sig")) {
            @{ File = $nsisExe; OutName = "ARF-FutsalTag-Windows-x64-setup.exe" }
          } elseif ($nsisZip -and (Test-Path "$($nsisZip.FullName).sig")) {
            @{ File = $nsisZip; OutName = "ARF-FutsalTag-Windows-x64.nsis.zip" }
          } else { $null }
          if ($updaterArtifact) {
            $outName = $updaterArtifact.OutName
            Copy-Item $updaterArtifact.File.FullName "release-assets\$outName" -Force
            Copy-Item "$($updaterArtifact.File.FullName).sig" "release-assets\$outName.sig" -Force
            $sig = (Get-Content "release-assets\$outName.sig" -Raw).Trim()
            @{
              platform = "windows-x86_64"
              filename = $outName
              signature = $sig
            } | ConvertTo-Json | Set-Content "release-assets\platform-windows-x86_64.json" -Encoding UTF8
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARF-FutsalTag-Windows-x64
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Updater Manifest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & latest.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist-release
          find artifacts -type f ! -name 'platform-*.json' -exec cp {} dist-release/ \;
          python3 - <<'PY'
          import datetime, json, os, pathlib

          tag = os.environ["TAG_NAME"]
          version = tag.lstrip("v")
          repo = os.environ["REPO"]
          platforms = {}

          for meta_path in pathlib.Path("artifacts").rglob("platform-*.json"):
              meta = json.loads(meta_path.read_text())
              platforms[meta["platform"]] = {
                  "signature": meta["signature"],
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{meta['filename']}",
              }

          if platforms:
              manifest = {
                  "version": version,
                  "notes": f"ARF FutsalTag {tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              pathlib.Path("dist-release/latest.json").write_text(json.dumps(manifest, indent=2))
          PY

      - name: Release macOS DMG, Windows Installer & Auto-Update Manifest
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
