name: Build macOS DMG (MacBook)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon-M1-M4
            os: macos-14
            target: aarch64-apple-darwin
          - arch: Intel-Mac
            os: macos-13
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install FFmpeg & Whisper CLI via Homebrew
        run: |
          brew install ffmpeg whisper-cpp

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Stage macOS offline binaries
        run: bash scripts/prepare-offline-bundle-macos.sh

      - name: Run Svelte check & Rust unit tests
        run: |
          bun run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build ARF FutsalTag macOS DMG
        run: bun run tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARF-FutsalTag-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Release macOS DMG to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
